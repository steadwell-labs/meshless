name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'specs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is half-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.18'

      # The specification page is generated from the markdown. Rebuild it here
      # rather than trusting the committed copy, so a stale page cannot reach
      # the published site even if someone forgot to run `npm run site`.
      - name: Render the specification from specs/
        run: node website/build.mjs

      - name: Sanity-check the artifact
        run: |
          set -euo pipefail
          for file in index.html 404.html spec/index.html spec/mlp-0000-core/index.html implementations/index.html assets/site.css .nojekyll; do
            test -f "website/$file" || { echo "missing website/$file"; exit 1; }
          done
          grep -q 'Relay access' website/index.html
          grep -q 'id="s19"' website/spec/mlp-0000-core/index.html
          # Project sites are served from a subpath; a root-relative asset would
          # 404 there. Fail the build instead of shipping a broken page.
          if grep -rnE '(href|src)="/[^/]' website --include='*.html'; then
            echo "root-relative links break a project-site deployment"; exit 1
          fi

      # Publishing needs a Pages site to exist, and that is a repository
      # setting this workflow cannot grant itself: a 404 here means an
      # administrator has not turned Pages on yet, which is a configuration
      # state and not a broken build. Warn and skip the deploy rather than go
      # red on every push; the moment Pages is enabled, the next run publishes.
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          if ! code=$(curl -sS -o "${RUNNER_TEMP}/pages.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}"); then
            echo "could not reach ${api}" >&2
            exit 1
          fi
          case "${code}" in
            200)
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              echo "GitHub Pages is enabled; publishing."
              ;;
            404)
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "::warning title=GitHub Pages is not enabled::Publishing skipped. An administrator must enable Pages for ${GITHUB_REPOSITORY} (Settings > Pages > Source: GitHub Actions), then re-run this workflow."
              {
                echo "### GitHub Pages is not enabled"
                echo
                echo "The site was built and verified, but not published: \`${GITHUB_REPOSITORY}\` has no Pages site yet."
                echo
                echo "An administrator of the repository needs to:"
                echo
                echo "1. Open **Settings → Pages**."
                echo "2. Set **Build and deployment → Source** to **GitHub Actions**."
                echo "3. Re-run this workflow, or push to \`main\`."
                echo
                echo "Until then this job warns and skips the deploy instead of failing."
              } >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              # Anything else is a real problem (bad token, missing permission,
              # API outage) and must not be silently mistaken for "not enabled".
              echo "unexpected HTTP ${code} from ${api}" >&2
              cat "${RUNNER_TEMP}/pages.json" >&2 || true
              exit 1
              ;;
          esac

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the site as a Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
